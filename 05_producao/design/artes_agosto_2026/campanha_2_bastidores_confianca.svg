<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Campanha 2 — Bastidores que viram confiança</title>
  <desc id="desc">Arte-base para Instagram da Serviscon mostrando seleção, integração, treinamento, supervisão e acompanhamento.</desc>
  <rect width="1080" height="1350" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1080" height="250" fill="#061F49"/>
  <text x="80" y="105" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">SERVISCON</text>
  <text x="80" y="178" fill="#10AEE0" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="900">O crachá não aparece sozinho</text>
  <text x="80" y="325" fill="#061F49" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800">Por trás de uma equipe alinhada existe:</text>
  <g transform="translate(100 430)">
    <line x1="70" y1="70" x2="70" y2="690" stroke="#10AEE0" stroke-width="10" stroke-linecap="round"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <circle cx="70" cy="70" r="54" fill="#10AEE0"/><text x="150" y="85" fill="#061F49" font-size="42" font-weight="800">Seleção</text>
      <circle cx="70" cy="225" r="54" fill="#061F49"/><text x="150" y="240" fill="#061F49" font-size="42" font-weight="800">Integração</text>
      <circle cx="70" cy="380" r="54" fill="#10AEE0"/><text x="150" y="395" fill="#061F49" font-size="42" font-weight="800">Treinamento</text>
      <circle cx="70" cy="535" r="54" fill="#061F49"/><text x="150" y="550" fill="#061F49" font-size="42" font-weight="800">Supervisão</text>
      <circle cx="70" cy="690" r="54" fill="#10AEE0"/><text x="150" y="705" fill="#061F49" font-size="42" font-weight="800">Acompanhamento</text>
    </g>
  </g>
  <rect x="80" y="1190" width="920" height="86" rx="30" fill="#061F49"/>
  <text x="120" y="1248" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">Terceirização com método, pessoas e gestão.</text>
</svg>
