<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Campanha 1 — O custo invisível do improviso</title>
  <desc id="desc">Arte-base para Instagram da Serviscon com alerta sobre risco operacional e terceirização com método.</desc>
  <rect width="1080" height="1350" fill="#061F49"/>
  <circle cx="930" cy="130" r="220" fill="#10AEE0" opacity="0.18"/>
  <circle cx="120" cy="1190" r="260" fill="#10AEE0" opacity="0.13"/>
  <text x="80" y="110" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">SERVISCON</text>
  <text x="80" y="172" fill="#10AEE0" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">TERCEIRIZAÇÃO + FACILITIES</text>
  <text x="80" y="315" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800">O custo</text>
  <text x="80" y="405" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800">invisível do</text>
  <text x="80" y="495" fill="#10AEE0" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="900">improviso</text>
  <rect x="80" y="585" width="920" height="330" rx="34" fill="#FFFFFF"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#061F49">
    <text x="135" y="670">✓ Falta vira urgência</text>
    <text x="135" y="755">✓ Serviço sem padrão</text>
    <text x="135" y="840">✓ Problema aparece tarde</text>
  </g>
  <path d="M130 1020 H950" stroke="#10AEE0" stroke-width="10" stroke-linecap="round"/>
  <text x="80" y="1100" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800">Terceirização profissional</text>
  <text x="80" y="1160" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800">é gestão, supervisão</text>
  <text x="80" y="1220" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800">e acompanhamento.</text>
  <text x="80" y="1288" fill="#10AEE0" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Salve e envie para quem cuida da operação.</text>
</svg>
