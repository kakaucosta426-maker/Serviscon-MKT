  <path d="M315 670 V725 M765 670 V725 M510 975 H570" stroke="#10AEE0" stroke-width="8" stroke-linecap="round"/>
  <text x="120" y="1150" fill="#061F49" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="800">Conheça os serviços da Serviscon.</text>
  <text x="120" y="1212" fill="#10AEE0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Limpeza • Portaria • Recepção • Manutenção • Facilities</text>
